[package]
name = "font-dialog"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "OS-native font picker dialogs (macOS NSFontPanel, Windows ChooseFont, Linux GTK4 FontDialog) behind one Rust API"
repository = "https://github.com/pilgrimagesoftware/font-dialog-rust"
readme = "README.md"
keywords = ["font", "dialog", "gui", "native"]
categories = ["gui", "os"]

[lib]
name = "font_dialog"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSFontPanel",
    "NSFontManager",
    "NSFont",
    "NSButton",
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.11"

[dev-dependencies]
